[project]
name = "format-it"
version = "0.3.0"
description = "将 Word 文档进行格式化"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "tomli-w>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort import 排序
    "UP",  # pyupgrade 语法现代化
    "B",   # flake8-bugbear 常见缺陷
]

[tool.ruff.format]
quote-style = "double"
